---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: backuppolicies.ops.leandro.ie
spec:
  group: ops.leandro.ie
  names:
    kind: BackupPolicy
    listKind: BackupPolicyList
    plural: backuppolicies
    singular: backuppolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cron schedule for backup runs
      jsonPath: .spec.schedule
      name: Schedule
      type: string
    - description: Time of the last successful backup
      jsonPath: .status.lastSuccessfulBackupTime
      name: Last Backup
      type: date
    - description: Ready condition status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BackupPolicy is the Schema for the backup policies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of BackupPolicy
            properties:
              retention:
                default: 7
                description: retention is the number of snapshots to keep for each
                  selected PVC. Defaults to 7.
                format: int32
                minimum: 1
                type: integer
              schedule:
                default: 0 0 * * *
                description: schedule is a five-field cron expression for when a backup
                  run is due. Defaults to 0 0 * * *.
                minLength: 1
                pattern: ^(\S+\s+){4}\S+$
                type: string
              snapshotClassName:
                description: snapshotClassName is the VolumeSnapshotClass to use.
                  When omitted, the controller uses the cluster default.
                type: string
              suspend:
                default: false
                description: suspend stops new backup runs when true. Defaults to
                  false.
                type: boolean
              targetSelector:
                description: targetSelector selects the PersistentVolumeClaims to
                  snapshot.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              verification:
                description: verification is the image and command used when verifyRestore
                  is true.
                properties:
                  command:
                    description: command is the container command, in exec form, run
                      against the restored volume.
                    items:
                      type: string
                    minItems: 1
                    type: array
                  image:
                    description: image is the container image that runs the verification
                      command.
                    type: string
                  timeoutSeconds:
                    default: 600
                    description: timeoutSeconds is how long the command may run. Defaults
                      to 600.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - command
                - image
                type: object
              verifyRestore:
