---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-ops-leandro-ie-v1alpha1-backuppolicy
  failurePolicy: Fail
  name: mbackuppolicy-v1alpha1.kb.io
  rules:
  - apiGroups:
    - ops.leandro.ie
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - backuppolicies
  sideEffects: None
