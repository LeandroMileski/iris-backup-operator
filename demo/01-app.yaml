apiVersion: v1
kind: Namespace
metadata:
  name: iris-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iris-data
  namespace: iris-demo
  labels:
    app.kubernetes.io/name: iris
    app: demo-database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-hostpath-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-db
  namespace: iris-demo
  labels:
    app: demo-database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-database
  template:
    metadata:
      labels:
        app: demo-database
        app.kubernetes.io/name: iris
    spec:
      containers:
        - name: database
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting database engine..."
              mkdir -p /data
              if [ ! -f /data/db.dat ]; then
                echo "INITIAL_DB_SCHEMA_V1" > /data/db.dat
                echo "CHECKSUM: VALID" >> /data/db.dat
              fi
              while true; do
                TX_ID=$(date +%s)
                echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') TX-${TX_ID}: COMMIT SUCCESS" >> /data/db.log
                sleep 5
              done
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: iris-data
