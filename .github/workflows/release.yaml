name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    name: Publish and sign
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # The runtime image digest is pinned in the Dockerfile.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the build
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cat > predicate.json <<EOF
          {
            "buildDefinition": {
              "buildType": "https://github.com/LeandroMileski/iris-backup-operator/release/v1",
              "externalParameters": {
                "source": "${SOURCE}",
                "ref": "${REF}",
                "digest": "${SHA}"
              },
              "internalParameters": {
                "platforms": ["linux/amd64", "linux/arm64"]
              },
              "resolvedDependencies": [
                {
                  "uri": "git+https://github.com/${SOURCE}@${REF}",
                  "digest": {"gitCommit": "${SHA}"}
                }
              ]
            },
            "runDetails": {
              "builder": {"id": "https://github.com/${SOURCE}/actions/workflows/release.yaml@${SHA}"},
              "metadata": {"invocationId": "${RUN_ID}"}
            }
          }
          EOF
          cosign attest --yes --predicate predicate.json --type slsaprovenance1 "${IMAGE}@${DIGEST}"
